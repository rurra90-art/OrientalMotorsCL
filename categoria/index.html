<title>Catalogo Oriental - Inmovilizado y Sobrestock</title>
<style>
:root{--bg:#0e1013;--panel:#15181e;--panel2:#1c2027;--line:#2a2f39;--txt:#e9ebee;--muted:#9aa0aa;

@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f5f6f8;--panel:#fff;--panel2:#eef0f3;
 --line:#e3e5ea;--txt:#171a1f;--muted:#5c626c;--accent:#d12b25;--accent2:#2563eb;--ok:#1a7f37;--warn:#9a6b00;--chip:#eef1f5;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{background:var(--panel);border-bottom:2px solid var(--accent);position:sticky;top:0;z-index:5}
.hwrap{max-width:1280px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hwrap img.logo{height:38px;width:auto;border-radius:6px;background:#fff;padding:2px}
.htitle h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.2px}
.htitle .sub{color:var(--muted);font-size:12.5px}
.back{margin-left:auto;color:var(--txt);text-decoration:none;border:1px solid var(--line);border-radius:9px;
 padding:8px 12px;font-size:13px;white-space:nowrap}
.back:hover{border-color:var(--accent)}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0 8px}
.controls input,.controls select{background:var(--panel2);color:var(--txt);border:1px solid var(--line);
 border-radius:10px;padding:10px 12px;font-size:14px;outline:none}
.controls input{flex:1;min-width:200px}
.controls input:focus,.controls select:focus{border-color:var(--accent2)}
.totbar{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0 16px}
.tot{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:150px}
.tot .lab{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
.tot .val{font-size:21px;font-weight:800;margin-top:2px}
.tot.acc{border-color:var(--accent)} .tot.acc .val{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:14px;margin-bottom:28px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;
 cursor:pointer;transition:border-color .12s,transform .12s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.ph{aspect-ratio:1/1;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:contain}
.ph .noimg{color:#aaa;font-size:12px}
.body{padding:10px 12px;display:flex;flex-direction:column;gap:7px;flex:1}
.cod{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:var(--accent2);font-weight:700;word-break:break-all}
.desc{font-size:13px;line-height:1.3;max-height:2.6em;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--muted)}
.price{font-weight:700;font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:auto;font-size:11.5px}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;border:1px solid var(--line)}
.b-inm{color:var(--warn);border-color:var(--warn)} .b-sob{color:var(--accent2);border-color:var(--accent2)}
.b-kit{color:var(--ok);border-color:var(--ok)}
.meli-si{color:var(--ok);font-weight:700}.meli-no{color:var(--muted)}
.statline{display:flex;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:7px;font-size:12px}
.statline b{color:var(--txt)} .statline .mut{color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.foot{color:var(--muted);font-size:12px;margin:10px 0 36px;text-align:center}
@media (max-width:560px){.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.htitle h1{font-size:16px}}
</style>

const fmt=n=>n.toLocaleString('es-CL'); const money=n=>'$'+Math.round(n).toLocaleString('es-CL');
(function(){const c={};DATA.forEach(r=>r.mo.forEach(m=>c[m]=(c[m]||0)+1));
 const opts=Object.keys(c).sort((a,b)=>c[b]-c[a]);
 document.getElementById('fmodelo').innerHTML='<option value="">Todos los modelos ('+DATA.length+')</option>'+
  opts.map(m=>'<option value="'+m+'">'+m+' ('+c[m]+')</option>').join('');})();
DATA.forEach(r=>r._h=(r.c+' '+r.d+' '+(r.b||'')+' '+r.mo.join(' ')+' '+r.ap.join(' ')).toUpperCase());
function filtered(){const q=document.getElementById('q').value.trim().toUpperCase();
 const fm=document.getElementById('fmodelo').value,fk=document.getElementById('fclase').value,fe=document.getElementById('fmeli').value;
 return DATA.filter(r=>{if(fm&&!r.mo.includes(fm))return false;if(fk&&r.k!==fk)return false;if(fe&&r.p!==fe)return false;
  if(q&&!r._h.includes(q))return false;return true;});}
function badge(k){return k==='inmovilizado'?'<span class="badge b-inm">inmovilizado</span>':
 k==='sobrestock'?'<span class="badge b-sob">sobrestock</span>':k==='kit'?'<span class="badge b-kit">kit</span>':'<span class="badge">'+k+'</span>';}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function card(r){
 const chips=r.mo.slice(0,4).map(m=>'<span class="chip" title="'+esc(r.ap.join(' | '))+'">'+esc(m)+'</span>').join('')
   +(r.mo.length>4?'<span class="chip">+'+(r.mo.length-4)+'</span>':'');
 const img=r.g?'<img loading="lazy" src="'+esc(r.g)+'" alt="'+esc(r.c)+'" onerror="this.parentNode.innerHTML=\'<span class=noimg>sin foto</span>\'">':'<span class="noimg">sin foto</span>';
 const precio=r.r?'<span class="price">$'+fmt(r.r)+'</span>':'';
 return '<div class="card" onclick="window.open(\''+r.l+'\',\'_blank\')">'+
  '<div class="ph">'+img+'</div><div class="body">'+
  '<div class="cod">'+esc(r.c)+'</div>'+
  '<div class="desc">'+esc(r.d)+'</div>'+
  '<div class="chips">'+chips+'</div>'+
  (precio?'<div>'+precio+(r.b?' <span class="chip">'+esc(r.b)+'</span>':'')+'</div>':'')+
  '<div class="meta">'+badge(r.k)+(r.p==='Si'?'<span class="meli-si">Meli</span>':'<span class="meli-no">sin Meli</span>')+'</div>'+
  '<div class="statline"><span class="mut">Stock</span> <b>'+fmt(r.s)+'</b><span class="mut">Valorizado</span> <b>'+money(r.v)+'</b></div>'+
  '</div></div>';}
function render(){const rows=filtered();
 document.getElementById('grid').innerHTML=rows.map(card).join('');
 document.getElementById('empty').style.display=rows.length?'none':'block';
 document.getElementById('tCount').textContent=fmt(rows.length);
 document.getElementById('tStock').textContent=fmt(rows.reduce((a,r)=>a+r.s,0));
 document.getElementById('tValor').textContent=money(rows.reduce((a,r)=>a+r.v,0));}
['q','fmodelo','fclase','fmeli'].forEach(id=>document.getElementById(id).addEventListener('input',render));
document.getElementById('foot').textContent='Fuente: existencia ERP 17-11-2026 + catalogo Oriental - '+DATA.length+' productos (80/20 inmovilizado + sobrestock, KO/PL/TY).';
render();
</script>
