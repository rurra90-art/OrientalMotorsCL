<style>
/* Tienda OM (maqueta): franja morada con buscador y carrito, barra de vehiculo en cascada, familias a la izquierda con conteo,
   catalogo a la derecha (cuadricula o filas), ficha de producto con dato tecnico al lado de la foto, aplicaciones y OEM desplegables,
   fila "Podria interesarte", carrito lateral, ruta de pago visible (sin procesar pagos) y cuenta con "Mi auto". */
:root {
  --bg: #f4f2f8; --surface: #ffffff; --ink: #1f1530; --muted: #6b6380; --line: #e4dfed; --line-2: #d6cfe3;
  --band: #522d83; --band-2: #3f1f6b; --band-ink: #ffffff; --band-muted: #d8cceb;
  --brand: #522d83; --brand-soft: #efe9f7; --red: #de1617; --red-2: #b81011; --red-ink: #ffffff; --red-soft: #fdeaea;
  --ok: #1f8a5a; --ok-soft: #e5f4ec; --warn: #9a5c00; --warn-soft: #fbf0dd; --ph: #f8f7fb; --photo: #ffffff;
  --shadow: 0 1px 2px rgba(50, 25, 90, .06), 0 6px 20px rgba(50, 25, 90, .08);
  --shadow-up: 0 2px 4px rgba(50, 25, 90, .08), 0 14px 32px rgba(50, 25, 90, .14);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #130e1b; --surface: #1d1628; --ink: #efebf6; --muted: #a79ebb; --line: #2f2541; --line-2: #3d3152;
    --band: #2c1749; --band-2: #1f0f36; --band-ink: #ffffff; --band-muted: #c7b6e3;
    --brand: #c3a6ef; --brand-soft: #2a2038; --red: #ef3536; --red-2: #ff5354; --red-ink: #ffffff; --red-soft: #3a1a20;
    --ok: #4fc78a; --ok-soft: #173326; --warn: #e8a64a; --warn-soft: #3a2a12; --ph: #251d33; --photo: #ffffff;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 6px 20px rgba(0, 0, 0, .3); --shadow-up: 0 2px 4px rgba(0, 0, 0, .4), 0 14px 32px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #130e1b; --surface: #1d1628; --ink: #efebf6; --muted: #a79ebb; --line: #2f2541; --line-2: #3d3152;
  --band: #2c1749; --band-2: #1f0f36; --band-ink: #ffffff; --band-muted: #c7b6e3;
  --brand: #c3a6ef; --brand-soft: #2a2038; --red: #ef3536; --red-2: #ff5354; --red-ink: #ffffff; --red-soft: #3a1a20;
  --ok: #4fc78a; --ok-soft: #173326; --warn: #e8a64a; --warn-soft: #3a2a12; --ph: #251d33; --photo: #ffffff;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 6px 20px rgba(0, 0, 0, .3); --shadow-up: 0 2px 4px rgba(0, 0, 0, .4), 0 14px 32px rgba(0, 0, 0, .45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; overflow-x: hidden; }
img { max-width: 100%; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
a { color: inherit; }
.inner { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
:where(button, input, select, a, summary):focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
.mono { font-family: var(--f-mono); }

/* ---------- cabecera ---------- */
.top { background: linear-gradient(160deg, var(--band) 0%, var(--band-2) 100%); color: var(--band-ink); border-bottom: 4px solid var(--red); position: sticky; top: 0; z-index: 30; }
.top .inner { display: flex; align-items: center; gap: 16px 22px; padding-top: max(12px, env(safe-area-inset-top, 0px)); padding-bottom: 12px; }
.logo { display: grid; line-height: .9; text-decoration: none; color: var(--band-ink); flex: none; }
.logo b { font-family: var(--f-display); font-weight: 700; font-size: 28px; letter-spacing: .02em; text-transform: uppercase; }
.logo { display: flex; align-items: center; gap: 12px; }
.logo-txt { display: grid; line-height: .9; }
.logo-img { height: 58px; width: auto; background: #fff; border-radius: 10px; padding: 3px 6px; box-shadow: 0 2px 10px rgba(0, 0, 0, .25); }
.logo.con-img .logo-txt b { display: none; }
.logo.con-img .logo-txt span { margin-top: 0; line-height: 1.6; white-space: nowrap; }
.logo-txt span { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--band-muted); margin-top: 4px; }
.qbox { flex: 1 1 auto; min-width: 0; position: relative; display: flex; }
.qbox svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: #6b6380; pointer-events: none; }
.qbox input { width: 100%; min-width: 0; font: inherit; font-size: 15px; padding: 11px 14px 11px 40px; border: 0; border-radius: 10px; background: #ffffff; color: #1f1530; }
.qbox input::placeholder { color: #8a829c; }
.acts { display: flex; gap: 6px; flex: none; }
.act { display: inline-flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .18); color: var(--band-ink); border-radius: 10px; padding: 9px 12px; cursor: pointer; font-size: 14px; font-weight: 500; position: relative; white-space: nowrap; }
.act:hover { background: rgba(255, 255, 255, .18); }
.act .badge { position: absolute; top: -7px; right: -7px; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--red); color: #fff; font-size: 11.5px; font-weight: 700; display: grid; place-items: center; border: 2px solid var(--band-2); font-variant-numeric: tabular-nums; }

/* ---------- barra de vehiculo ---------- */
.veh { background: var(--surface); border-bottom: 1px solid var(--line); }
.veh .inner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding-block: 12px; }
.veh h2 { font-family: var(--f-display); font-weight: 700; text-transform: uppercase; font-size: 19px; letter-spacing: .03em; margin: 0; color: var(--brand); display: flex; align-items: center; gap: 8px; flex: none; }
.vsel { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; flex: 1 1 560px; min-width: 0; }
.vsel label { display: grid; gap: 2px; min-width: 0; }
.vsel label span { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-left: 2px; }
select { font: inherit; font-size: 14px; padding: 9px 10px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--bg); color: var(--ink); min-width: 0; width: 100%; }
select:disabled { opacity: .55; }
.vacts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 6px 11px; border-radius: 99px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap; }
.chip:hover { border-color: var(--brand); }
.chip.on { background: var(--brand); border-color: var(--brand); color: #fff; }
.chip.mine { border-color: var(--red); color: var(--red); }
.chip.mine.on { background: var(--red); color: #fff; }
.chip .x { font-weight: 700; opacity: .7; }
.link { background: none; border: 0; padding: 4px 2px; color: var(--brand); font-weight: 600; font-size: 13.5px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- layout catalogo ---------- */
main { padding-block: 20px 64px; min-height: 60vh; }
.layout { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 22px; align-items: start; }
.side { position: sticky; top: 96px; max-height: calc(100vh - 110px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.side h3 { font-family: var(--f-display); text-transform: uppercase; font-size: 18px; letter-spacing: .04em; margin: 0; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; }
.side h3 .link { font-family: var(--f-body); text-transform: none; letter-spacing: 0; }
.tree { list-style: none; margin: 0; padding: 6px 0 10px; }
.tree > li + li { border-top: 1px solid var(--line); }
.fbtn { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; background: none; border: 0; padding: 10px 16px; cursor: pointer; font-weight: 600; font-size: 14.5px; }
.fbtn:hover { background: var(--brand-soft); }
.fbtn .car { width: 14px; height: 14px; flex: none; color: var(--muted); transition: transform .15s; }
.fbtn[aria-expanded="true"] .car { transform: rotate(90deg); }
.fbtn .nm { flex: 1; min-width: 0; }
.n { font-size: 12px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; background: var(--bg); border-radius: 99px; padding: 1px 8px; }
.fbtn.sel { color: var(--brand); }
.fbtn.sel .n { background: var(--brand); color: #fff; }
.subs { list-style: none; margin: 0 0 8px; padding: 0 0 0 26px; }
.sbtn { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: left; background: none; border: 0; border-left: 2px solid var(--line); padding: 6px 16px 6px 12px; cursor: pointer; font-size: 14px; color: var(--ink); }
.sbtn:hover { border-left-color: var(--brand); color: var(--brand); }
.sbtn.sel { border-left-color: var(--red); color: var(--red); font-weight: 600; }
.sbtn.sel .n { background: var(--red); color: #fff; }
.zero { opacity: .42; }

.tools { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.crumbs { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.crumbs button { background: none; border: 0; padding: 0; cursor: pointer; color: var(--muted); font-size: 13px; }
.crumbs button:hover { color: var(--brand); text-decoration: underline; }
.crumbs b { color: var(--ink); font-weight: 600; }
.ttl { font-family: var(--f-display); font-weight: 700; text-transform: uppercase; font-size: clamp(26px, 3.4vw, 36px); line-height: 1; margin: 6px 0 2px; letter-spacing: .01em; }
.cnt { font-size: 13.5px; color: var(--muted); }
.cnt b { color: var(--ink); }
.right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.right select { width: auto; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { background: none; border: 0; padding: 8px 11px; cursor: pointer; color: var(--muted); display: grid; place-items: center; }
.seg button[aria-pressed="true"] { background: var(--brand); color: #fff; }
.right .btn-fil { display: none; }
.active-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: -4px 0 14px; }

/* tarjetas */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow); position: relative; min-width: 0; }
.card:hover { box-shadow: var(--shadow-up); }
.card a.cover { position: absolute; inset: 0; z-index: 1; }
.ph { position: relative; aspect-ratio: 1 / 1; background: var(--photo); display: grid; place-items: center; overflow: hidden; border-bottom: 1px solid var(--line); }
.ph img { width: 100%; height: 100%; object-fit: contain; padding: 10px; }
.ph.vacia { background: var(--ph); color: var(--muted); }
.ph.vacia small { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
.ph .pdots { position: absolute; left: 0; right: 0; bottom: 8px; display: flex; justify-content: center; gap: 5px; pointer-events: none; opacity: .55; transition: opacity .15s; }
.card:hover .ph .pdots { opacity: 1; }
.ph .pdots i { width: 7px; height: 7px; border-radius: 99px; background: rgba(82, 45, 131, .28); transition: width .15s, background .15s; }
.ph .pdots i.on { width: 18px; background: var(--red); }
.grid.rows .ph .pdots { bottom: 6px; }
.ph .sf { position: absolute; left: 8px; top: 8px; font-size: 11px; font-weight: 600; background: rgba(82, 45, 131, .92); color: #fff; padding: 3px 8px; border-radius: 99px; max-width: calc(100% - 16px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cb { padding: 12px 14px 14px; display: grid; gap: 6px; flex: 1; align-content: start; }
.tag { font-family: var(--f-mono); font-weight: 600; font-size: 12px; background: var(--red); color: var(--red-ink); padding: 2px 8px; border-radius: 6px; letter-spacing: .03em; justify-self: start; word-break: break-all; }
.cd { font-weight: 600; font-size: 14.5px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cm { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; }
.fit { font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 99px; justify-self: start; }
.fit.ok { color: var(--ok); background: var(--ok-soft); }
.fit.no { color: var(--warn); background: var(--warn-soft); }
.cf { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: auto; padding-top: 10px; }
.price { font-family: var(--f-display); font-weight: 700; font-size: 24px; line-height: 1; font-variant-numeric: tabular-nums; }
.add { position: relative; z-index: 2; display: inline-flex; align-items: center; gap: 6px; background: var(--red); color: #fff; border: 0; border-radius: 10px; padding: 8px 12px; font-weight: 600; font-size: 13.5px; cursor: pointer; }
.add:hover { background: var(--red-2); }
.add.done { background: var(--ok); }

/* vista filas */
.grid.rows { grid-template-columns: 1fr; gap: 10px; }
.grid.rows .card { flex-direction: row; align-items: stretch; }
.grid.rows .ph { width: 150px; flex: none; aspect-ratio: auto; border-bottom: 0; border-right: 1px solid var(--line); }
.grid.rows .cb { grid-template-columns: minmax(0, 1fr) auto; column-gap: 18px; padding: 14px 16px; }
.grid.rows .cb > :not(.cf) { grid-column: 1; }
.grid.rows .cf { grid-column: 2; grid-row: 1 / span 5; flex-direction: column; align-items: flex-end; justify-content: center; margin: 0; padding: 0; }
.grid.rows .cd { -webkit-line-clamp: 1; }
.apl-mini { font-size: 12.5px; color: var(--muted); }
.apl-mini b { color: var(--ink); font-weight: 600; }
.grid:not(.rows) .apl-mini { display: none; }
.more { display: flex; justify-content: center; margin-top: 20px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 10px; padding: 11px 18px; font-weight: 600; font-size: 14.5px; cursor: pointer; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); text-decoration: none; }
.btn:hover { border-color: var(--brand); }
.btn.pri { background: var(--red); border-color: var(--red); color: #fff; }
.btn.pri:hover { background: var(--red-2); }
.btn.sec { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.empty { padding: 56px 16px; color: var(--muted); text-align: center; background: var(--surface); border: 1px dashed var(--line-2); border-radius: var(--r); }
.empty b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 6px; }

/* fila podria interesarte */
.rel { margin-top: 34px; }
.rel h3 { font-family: var(--f-display); font-weight: 700; text-transform: uppercase; font-size: 24px; margin: 0; letter-spacing: .02em; }
.rel .rsub { font-size: 13.5px; color: var(--muted); margin: 2px 0 12px; }
.rel .rtabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.strip { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(190px, 210px); gap: 12px; overflow-x: auto; padding: 2px 2px 12px; scroll-snap-type: x proximity; }
.strip .card { scroll-snap-align: start; }
.strip .price { font-size: 21px; }

/* ---------- ficha de producto ---------- */
.back { margin-bottom: 12px; }
.pd { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.gal { display: grid; gap: 10px; min-width: 0; }
.gal .big { aspect-ratio: 1 / 1; background: var(--photo); border-radius: var(--r); border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; box-shadow: var(--shadow); color: #6b6380; }
.gal .big img { width: 100%; height: 100%; object-fit: contain; padding: 14px; }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.thumbs button { width: 72px; height: 72px; padding: 0; border: 2px solid var(--line); border-radius: 10px; background: var(--photo); cursor: pointer; overflow: hidden; }
.thumbs button[aria-current="true"] { border-color: var(--red); }
.thumbs img { width: 100%; height: 100%; object-fit: contain; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 20px 20px 18px; display: grid; gap: 14px; min-width: 0; }
.box h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(26px, 3.2vw, 34px); line-height: 1.02; text-transform: uppercase; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.box .fam { font-size: 13px; color: var(--muted); }
.buy { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 14px 0; border-block: 1px solid var(--line); }
.buy .price { font-size: 38px; }
.buy .pnote { font-size: 12px; color: var(--muted); flex-basis: 100%; margin-top: -6px; }
.qty { display: inline-flex; border: 1px solid var(--line-2); border-radius: 10px; overflow: hidden; background: var(--bg); }
.qty button { width: 36px; border: 0; background: none; cursor: pointer; font-size: 18px; font-weight: 600; color: var(--ink); }
.qty input { width: 44px; border: 0; text-align: center; font: inherit; font-weight: 600; background: transparent; color: var(--ink); -moz-appearance: textfield; }
.qty input::-webkit-outer-spin-button, .qty input::-webkit-inner-spin-button { -webkit-appearance: none; }
.buy .add { padding: 11px 18px; font-size: 15px; }
.spec { width: 100%; border-collapse: collapse; font-size: 14px; }
.spec th { text-align: left; font-weight: 500; color: var(--muted); padding: 7px 10px 7px 0; width: 44%; vertical-align: top; }
.spec td { padding: 7px 0; font-weight: 600; overflow-wrap: anywhere; }
.spec tr + tr { border-top: 1px solid var(--line); }
.spec .grp th { padding-top: 14px; font-family: var(--f-display); font-size: 15px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--brand); }
.compat { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; padding: 10px 12px; border-radius: 10px; }
.compat.ok { background: var(--ok-soft); color: var(--ok); }
.compat.no { background: var(--warn-soft); color: var(--warn); }
.compat.nv { background: var(--brand-soft); color: var(--brand); }
.compat b { display: block; }

.sec2 { margin-top: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.sec2 > h2 { font-family: var(--f-display); font-weight: 700; text-transform: uppercase; font-size: 22px; letter-spacing: .03em; margin: 0; padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.sec2 > h2 small { font-family: var(--f-body); font-size: 13px; text-transform: none; letter-spacing: 0; color: var(--muted); font-weight: 500; }
.sec2 { overflow: hidden; }
.sec2 > h2 { background: linear-gradient(160deg, var(--band) 0%, var(--band-2) 100%); color: #fff; border-bottom: 3px solid var(--red); }
.sec2 > h2 small { color: var(--band-muted); }
.logo .logo-txt .tagline { display: grid; gap: 3px; margin-top: 6px; font-family: var(--f-body); text-transform: none; letter-spacing: 0; color: #fff; white-space: nowrap; }
.logo.con-img .logo-txt .tagline { margin-top: 0; padding-left: 14px; border-left: 1px solid rgba(255, 255, 255, .3); line-height: 1; }
.tagline em { font-style: normal; font-family: var(--f-display); font-weight: 700; font-size: 21px; letter-spacing: .07em; text-transform: uppercase; line-height: 1; color: #fff; }
.tagline i { font-style: normal; font-size: 12.5px; font-weight: 600; letter-spacing: .05em; line-height: 1.2; color: var(--band-muted); }
.brow { border-bottom: 1px solid var(--line); }
.brow:last-child { border-bottom: 0; }

/* ---------- carrito / pago / cuenta ---------- */

.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.myc { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; }

.pay { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 22px; align-items: start; }

/* ---------- responsive ---------- */

}
@media (max-width: 640px) {
  .top .inner { flex-wrap: wrap; gap: 10px; }

  .logo-txt span { letter-spacing: .08em; font-size: 9.5px; }

  .paym { grid-template-columns: 1fr; }
  .two { grid-template-columns: 1fr; }
  .strip { grid-auto-columns: 168px; }
}
.gal .big.zoom { cursor: zoom-in; }
.gal .big.zoom:hover { box-shadow: var(--shadow-up); }
dialog.visor { width: 100vw; height: 100vh; max-width: 100vw; max-height: 100vh; margin: 0; background: rgba(12, 6, 22, .94); color: #fff; }
dialog.visor::backdrop { background: rgba(12, 6, 22, .7); }
.vw { display: flex; flex-direction: column; height: 100%; padding: max(12px, env(safe-area-inset-top, 0px)) 16px max(12px, env(safe-area-inset-bottom, 0px)); gap: 12px; }
.vh { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

.vimg { flex: 1; min-height: 0; position: relative; display: grid; place-items: center; }

.vnav { position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; border-radius: 99px; border: 0; background: rgba(255, 255, 255, .16); color: #fff; font-size: 34px; line-height: 1; cursor: pointer; }

.vthumbs button[aria-current="true"] { border-color: var(--red); opacity: 1; }
.vthumbs img { width: 100%; height: 100%; object-fit: contain; }
.hero { position: relative; margin-bottom: 22px; border-radius: 16px; overflow: hidden; box-shadow: var(--shadow-up); background: var(--band-2); }
.htrack { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; scroll-behavior: smooth; }
.htrack::-webkit-scrollbar { display: none; }

@media (max-width: 640px) { .hero.escritorio { display: none; } .hero.movil { display: block; } .hnav { display: none; } .hero { border-radius: 14px; } }
.wsp { position: fixed; right: max(18px, env(safe-area-inset-right, 0px)); bottom: max(18px, env(safe-area-inset-bottom, 0px)); z-index: 40; display: inline-flex; align-items: center; gap: 10px; background: #1fa855; color: #fff; border: 0; border-radius: 99px; padding: 12px 18px 12px 14px; font-weight: 700; font-size: 15px; cursor: pointer; box-shadow: 0 6px 22px rgba(0, 0, 0, .28); }

@media (max-width: 640px) { .wsp .lbl { display: none; } .wsp { padding: 14px; } }

/* ---------- v8: precio a consultar, calidades, videos, mantencion ---------- */
:root { --tO: #522d83; --tO-soft: #efe9f7; --tP: #0b63a8; --tP-soft: #e3f0fa; --tE: #1f7a4f; --tE-soft: #e4f3eb; }

:root[data-theme="dark"] { --tO: #c3a6ef; --tO-soft: #2a2038; --tP: #6fb6ee; --tP-soft: #142a3b; --tE: #5ccf94; --tE-soft: #15301f; }

.tier { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; letter-spacing: .02em; padding: 2px 8px 2px 6px; border-radius: 99px; white-space: nowrap; }
.tier .lv { display: inline-flex; gap: 2px; align-items: flex-end; }
.tier .lv i { width: 3px; border-radius: 2px; background: currentColor; opacity: .25; }
.tier .lv i:nth-child(1) { height: 6px; } .tier .lv i:nth-child(2) { height: 9px; } .tier .lv i:nth-child(3) { height: 12px; }

.tier.tO { color: var(--tO); background: var(--tO-soft); } .tier.tP { color: var(--tP); background: var(--tP-soft); } .tier.tE { color: var(--tE); background: var(--tE-soft); }

.vpill { position: absolute; right: 8px; top: 8px; display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; background: rgba(20, 8, 40, .78); color: #fff; padding: 3px 8px 3px 6px; border-radius: 99px; }
.qhint { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--brand); background: var(--brand-soft); border: 0; border-radius: 99px; padding: 6px 12px; cursor: pointer; }
.qhint:hover { text-decoration: underline; }

/* elige tu calidad */
.qwrap { padding: 16px 18px 18px; }
.qintro { font-size: 13.5px; color: var(--muted); margin: 0 0 14px; }
.qcols { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }

.qcol::before { content: ""; height: 5px; background: var(--qc); }
.qcol.tO { --qc: var(--tO); --qs: var(--tO-soft); } .qcol.tP { --qc: var(--tP); --qs: var(--tP-soft); } .qcol.tE { --qc: var(--tE); --qs: var(--tE-soft); }
.qcol.cur { border-color: var(--qc); box-shadow: 0 0 0 2px var(--qc) inset, var(--shadow); }

/* videos */

  const tierHTML = (q, lg) => { const t = TIER[q] || TIER.E; return `<span class="tier t${q || "E"}${lg ? " lg" : ""}" title="${esc(t.d)}"><span class="lv">${[1, 2, 3].map(k => `<i${k <= t.lv ? ' class="on"' : ""}></i>`).join("")}</span>${t.n}</span>`; };
  // otras calidades del mismo repuesto (grupo de homologos)
  const GRP = new Map();
  ITEMS.forEach(i => { if (i.h) { if (!GRP.has(i.h)) GRP.set(i.h, []); GRP.get(i.h).push(i); } });
  const otras = i => (i.h && GRP.get(i.h)) || [i];
  const media = i => (i.i || []).map(s => ({ t: "img", s })).concat(i.v ? [{ t: "vid", s: i.v, p: i.vp || (i.i || [])[0] || "" }] : []);
  const thumbImg = i => { const s = (i.i || [])[0] || i.vp; return s ? `<span class="qimg"><img src="${esc(s)}" alt="" loading="lazy"></span>` : `<span class="qimg vacia">${ICON.photo}</span>`; };

  // texto de busqueda precalculado
  ITEMS.forEach(i => {
    i._h = norm([i.c, i.d, i.m, i.p, i.f, i.s, (i.o || []).join(" "), [...new Set((i.a || []).map(a => a[0] + " " + a[1] + " " + a[2]))].join(" ")].join(" "));
    i._hc = norm(i.c + " " + (i.o || []).join(" ")).replace(/[\s\-.]/g, "");
  });

  // ---------------- estado
  const S = { q: "", fam: "", sub: "", marca: "", modelo: "", motor: "", anio: "", orden: "rel", vista: store.get("om_vista", "grid"), lim: PAGE, miAuto: false };

  const appMatch = (a, v) => (!v.marca || a[0] === v.marca) && (!v.modelo || a[1] === v.modelo) && (!v.motor || a[2] === v.motor)
    && (!v.anio || !a[6] || (a[6] <= +v.anio && +v.anio <= a[7]));
  const vehOn = v => !!(v.marca || v.modelo || v.motor || v.anio);
  const fitsVeh = (i, v) => !vehOn(v) || (i.a || []).some(a => appMatch(a, v));
  const fitsQ = (i, q) => {
    if (!q) return true;
    const toks = norm(q).split(/\s+/).filter(Boolean);
    const qc = norm(q).replace(/[\s\-.]/g, "");
    if (qc.length >= 5 && i._hc.includes(qc)) return true;
    return toks.every(t => i._h.includes(t));
  };
  const fitsFam = (i, f, s) => (!f || i.f === f) && (!s || i.s === s);
  // x = entro solo como otra calidad o para el kit, sin foto: no se lista (salvo busqueda por su codigo)
  const listable = (i, q) => !i.x || (q && norm(q).replace(/[\s\-.]/g, "").length >= 5 && i._hc.includes(norm(q).replace(/[\s\-.]/g, "")));
  const curVeh = () => ({ marca: S.marca, modelo: S.modelo, motor: S.motor, anio: S.anio });

  // ---------------- selects de vehiculo en cascada (se alimentan del resto de filtros)
  function vehOptions(base, v) {
    // base: productos ya filtrados por busqueda/familia. Devuelve opciones con conteo de productos para cada nivel.
    const cnt = { marca: new Map(), modelo: new Map(), motor: new Map(), anio: new Map(), lbl: new Map() };
    for (const i of base) {
      const seen = { marca: new Set(), modelo: new Set(), motor: new Set(), anio: new Set() };
      for (const a of (i.a || [])) {
        if (ORDEN_MARCA.includes(a[0])) seen.marca.add(a[0]);
        if (v.marca && a[0] !== v.marca) continue;
        if (v.marca) seen.modelo.add(a[1]);
        if (v.modelo && a[1] !== v.modelo) continue;
        if (v.modelo && a[2]) {
          seen.motor.add(a[2]);
          const k = [a[3], cap(a[4])].filter(Boolean).join(" ");
          if (!cnt.lbl.has(a[2])) cnt.lbl.set(a[2], new Map());
          cnt.lbl.get(a[2]).set(k, (cnt.lbl.get(a[2]).get(k) || 0) + 1);
        }
        if (v.motor && a[2] !== v.motor) continue;
        if (v.modelo && a[6]) for (let y = Math.max(a[6], 1970); y <= Math.min(a[7], 2027); y++) seen.anio.add(y);
      }
      for (const k in seen) for (const x of seen[k]) cnt[k].set(x, (cnt[k].get(x) || 0) + 1);
    }
    // etiqueta del motor: Cilindrada + Combustible + Motor (la combinacion mas cargada para ese motor)
    const lbl = new Map();
    for (const [m, c] of cnt.lbl) { const top = [...c.entries()].sort((x, y) => y[1] - x[1])[0][0]; lbl.set(m, [top, m].filter(Boolean).join(" ")); }
    cnt.motorLbl = m => lbl.get(m) || m;
    cnt.motorOrd = (x, y) => (parseFloat(cnt.motorLbl(x)) || 99) - (parseFloat(cnt.motorLbl(y)) || 99) || cnt.motorLbl(x).localeCompare(cnt.motorLbl(y), "es", { numeric: true });
    return cnt;
  }
  function fillSelect(sel, ph, map, val, sorter, label) {
    const ks = [...map.keys()].sort(sorter);
    if (val && !map.has(val)) ks.unshift(val);
    sel.innerHTML = `<option value="">${ph}</option>` + ks.map(k => `<option value="${esc(k)}"${String(k) === String(val) ? " selected" : ""}>${esc(label ? label(k) : k)} (${map.get(k) || 0})</option>`).join("");
  }
  function renderVeh() {
    const enKit = location.hash.startsWith("#/mantencion");
    const base = ITEMS.filter(i => (enKit ? esKit(i) : listable(i, S.q) && fitsQ(i, S.q) && fitsFam(i, S.fam, S.sub)));
    const c = vehOptions(base, curVeh());
    fillSelect($("#vMarca"), "Todas las marcas", c.marca, S.marca, ordenMarca, cap);
    fillSelect($("#vModelo"), S.marca ? "Todos los modelos" : "Elige marca", c.modelo, S.modelo, (a, b) => a.localeCompare(b, "es", { numeric: true }));
    fillSelect($("#vMotor"), S.modelo ? "Todos los motores" : "Elige modelo", c.motor, S.motor, c.motorOrd, c.motorLbl);
    fillSelect($("#vAnio"), S.modelo ? "Todos los años" : "Elige modelo", c.anio, S.anio, (a, b) => b - a);
    $("#vModelo").disabled = !S.marca; $("#vMotor").disabled = !S.modelo; $("#vAnio").disabled = !S.modelo;
    const mine = preferido();
    let h = "";
    if (mine) h += `<button class="chip mine${S.miAuto ? " on" : ""}" id="cMi" type="button" title="Filtrar por mi auto">${S.miAuto ? ICON.ok : ""}Mi auto: ${esc(autoTxt(mine))}</button>`;
    if (vehOn(curVeh())) h += `<button class="link" id="cVehX" type="button">Limpiar vehículo</button>`;
    $("#vacts").innerHTML = h;
    $("#cMi") && ($("#cMi").onclick = () => { if (S.miAuto) setVeh({}); else usarAuto(mine); });
    $("#cVehX") && ($("#cVehX").onclick = () => setVeh({}));
  }
  function setVeh(v) {
    S.marca = v.marca || ""; S.modelo = v.modelo || ""; S.motor = v.motor || ""; S.anio = v.anio ? String(v.anio) : "";
    const m = preferido();
    S.miAuto = !!(m && m.marca === S.marca && m.modelo === S.modelo && (m.motor || "") === S.motor && String(m.anio || "") === S.anio);
    S.lim = PAGE; refresh();
  }
  function limpiarCatalogo() { S.q = ""; $("#q").value = ""; S.fam = ""; S.sub = ""; S.orden = "rel"; }
  function inicio() { limpiarCatalogo(); setVeh({}); S.miAuto = false; if (location.hash !== "#/" && location.hash !== "") go("#/"); window.scrollTo(0, 0); }
  // al cambiar marca o modelo se parte de cero (categoria y busqueda incluidas); motor y año solo afinan
  $("#vMarca").onchange = e => { limpiarCatalogo(); setVeh({ marca: e.target.value }); };
  $("#vModelo").onchange = e => { limpiarCatalogo(); setVeh({ marca: S.marca, modelo: e.target.value }); };
  $("#vMotor").onchange = e => setVeh({ marca: S.marca, modelo: S.modelo, motor: e.target.value, anio: S.anio });
  $("#vAnio").onchange = e => setVeh({ marca: S.marca, modelo: S.modelo, motor: S.motor, anio: e.target.value });

  // ---------------- arbol de familias (conteos con busqueda + vehiculo)
  function famCounts() {
    const v = curVeh(), f = new Map(), s = new Map();
    for (const i of ITEMS) {
      if (!listable(i, S.q) || !fitsQ(i, S.q) || !fitsVeh(i, v)) continue;
      f.set(i.f, (f.get(i.f) || 0) + 1);
      s.set(i.f + "|" + i.s, (s.get(i.f + "|" + i.s) || 0) + 1);
    }
    return { f, s };
  }
  const ALLFAM = (() => {
    const m = new Map();
    for (const i of ITEMS) { if (!m.has(i.f)) m.set(i.f, new Set()); m.get(i.f).add(i.s); }
    return [...m.keys()].sort((a, b) => (a === "Otros repuestos") - (b === "Otros repuestos") || a.localeCompare(b, "es")).map(f => [f, [...m.get(f)].sort((a, b) => a.localeCompare(b, "es"))]);
  })();
  function treeHTML() {
    const c = famCounts();
    const tot = [...c.f.values()].reduce((a, b) => a + b, 0);
    let h = `<h3>Categorías ${S.fam ? '<button class="link" type="button" data-fam="">Ver todas</button>' : ""}</h3><ul class="tree">`;
    h += `<li><button class="fbtn${!S.fam ? " sel" : ""}" type="button" data-fam=""><span class="nm">Todos los productos</span><span class="n">${tot}</span></button></li>`;
    for (const [f, subs] of ALLFAM) {
      const n = c.f.get(f) || 0, open = S.fam === f;
      if (!n && !open) { h += `<li class="zero"><button class="fbtn" type="button" data-fam="${esc(f)}" aria-expanded="false">${ICON.car}<span class="nm">${esc(f)}</span><span class="n">0</span></button></li>`; continue; }
      h += `<li><button class="fbtn${open && !S.sub ? " sel" : ""}" type="button" data-fam="${esc(f)}" aria-expanded="${open}">${ICON.car}<span class="nm">${esc(f)}</span><span class="n">${n}</span></button>`;
      if (open) {
        h += `<ul class="subs">` + subs.map(s => {
          const k = c.s.get(f + "|" + s) || 0;
          return `<li${!k ? ' class="zero"' : ""}><button class="sbtn${S.sub === s ? " sel" : ""}" type="button" data-fam="${esc(f)}" data-sub="${esc(s)}"><span>${esc(s)}</span><span class="n">${k}</span></button></li>`;
        }).join("") + `</ul>`;
      }
      h += `</li>`;
    }
    return h + `</ul>`;
  }
  function bindTree(root) {
    root.querySelectorAll("[data-fam]").forEach(b => b.onclick = () => {
      const f = b.dataset.fam, s = b.dataset.sub || "";
      if (!s && f && S.fam === f && !S.sub) { S.fam = ""; } else { S.fam = f; S.sub = s; }
      if (!f) S.sub = "";
      S.lim = PAGE;
      if (root.closest("dialog")) root.closest("dialog").close();
      go("#/");
    });
  }

  // ---------------- tarjetas
  function fitBadge(i) {
    const v = curVeh();
    if (!vehOn(v)) return "";
    return fitsVeh(i, v) ? `<span class="fit ok">${ICON.ok} Compatible</span>` : `<span class="fit no">No confirmado para tu vehículo</span>`;
  }
  function aplMini(i) {
    const m = new Map();
    let otras = 0;
    for (const a of (i.a || [])) { if (!ORDEN_MARCA.includes(a[0])) { otras++; continue; } if (!m.has(a[0])) m.set(a[0], new Set()); m.get(a[0]).add(a[1]); }
    if (!m.size) return otras ? `<div class="apl-mini">Aplica en otras marcas (ver ficha)</div>` : "";
    return `<div class="apl-mini">Aplica en ${[...m.keys()].sort(ordenMarca).slice(0, 4).map(k => `<b>${esc(cap(k))}</b> ${esc([...m.get(k)].slice(0, 3).join(", "))}${m.get(k).size > 3 ? "…" : ""}`).join(" · ")}</div>`;
  }
  function card(i, opts = {}) {
    const img = i.i && i.i[0];
    return `<article class="card">
      <a class="cover" href="#/p/${encodeURIComponent(i.c)}" aria-label="${esc(i.d)}"></a>
      <div class="ph${img ? "" : " vacia"}"${i.i.length > 1 ? ` data-ph="${esc(i.c)}"` : ""}>${img ? `<img src="${esc(img)}" alt="" loading="lazy" decoding="async">` : ICON.photo + "<small>Sin foto</small>"}${opts.sub ? `<span class="sf">${esc(i.s)}</span>` : ""}${i.v ? `<span class="vpill">${ICON.play}Video</span>` : ""}${i.i.length > 1 ? `<span class="pdots" aria-hidden="true">${i.i.map((f, k) => `<i${k ? "" : ' class="on"'}></i>`).join("")}</span>` : ""}</div>
      <div class="cb">
        <span class="tag">${esc(i.c)}</span>
        <div class="cd">${esc(i.d)}</div>
        <div class="cm">${tierHTML(i.q)}${i.m ? `<span>${esc(i.m)}</span>` : ""}${i.p ? `<span>${esc(cap(i.p))}</span>` : ""}</div>
        ${aplMini(i)}${fitBadge(i)}
        <div class="cf">${precio(i)}<button class="add" type="button" data-add="${esc(i.c)}">${ICON.cart}<span class="lbl">Agregar</span></button></div>
      </div></article>`;
  }

  // ---------------- fotos de la tarjeta al pasar el mouse
  let phAct = null;
  function phPinta(ph, k) {
    const it = BY.get(ph.dataset.ph); if (!it) return;
    const img = ph.querySelector("img");
    if (img && img.getAttribute("src") !== it.i[k]) img.src = it.i[k];
    ph.querySelectorAll(".pdots i").forEach((d, j) => d.classList.toggle("on", j === k));
  }
  document.addEventListener("mousemove", e => {
    // el enlace de la tarjeta tapa la foto, asi que se busca la foto de la tarjeta y se mira si el cursor esta encima
    const card = e.target.closest && e.target.closest(".card");
    let ph = card && card.querySelector("[data-ph]"), r = ph && ph.getBoundingClientRect();
    if (ph && !(e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom)) ph = null;
    if (phAct && phAct !== ph) { phPinta(phAct, 0); phAct = null; }
    if (!ph) return;
    const it = BY.get(ph.dataset.ph); if (!it) return;
    if (!ph._pre) { ph._pre = 1; it.i.slice(1).forEach(f => { const x = new Image(); x.src = f; }); }
    phPinta(ph, Math.min(it.i.length - 1, Math.max(0, Math.floor((e.clientX - r.left) / r.width * it.i.length))));
    phAct = ph;
  }, { passive: true });
  document.addEventListener("mouseleave", () => { if (phAct) { phPinta(phAct, 0); phAct = null; } });

  // ---------------- podria interesarte
  function relacionados(base, max = 14) {
    // misma familia, otra subfamilia; primero los que comparten vehiculo (o calzan con el vehiculo elegido)
    const v = curVeh(), sel = vehOn(v);
    const fam = base.f, subs = new Set([base.s]);
    const mods = new Set((base.a || []).map(a => a[0] + "|" + a[1]));
    const cand = [];
    for (const i of ITEMS) {
      if (i.f !== fam || subs.has(i.s) || i.c === base.c || i.x) continue;
      if (sel && !fitsVeh(i, v)) continue;
      let comp = 0;
      for (const a of (i.a || [])) if (mods.has(a[0] + "|" + a[1])) comp++;
      cand.push([i, comp * 10 + (i.i.length ? 4 : 0) + Math.min((i.a || []).length, 3)]);
    }
    cand.sort((a, b) => b[1] - a[1] || a[0].c.localeCompare(b[0].c));
    // repartir entre subfamilias para que salgan pastillas, balatas, tambor... y no solo una
    const porSub = new Map();
    for (const [i] of cand) { if (!porSub.has(i.s)) porSub.set(i.s, []); porSub.get(i.s).push(i); }
    const out = [];
    for (let r = 0; out.length < max; r++) {
      let alguno = false;
      for (const l of porSub.values()) if (l[r] && out.length < max) { out.push(l[r]); alguno = true; }
      if (!alguno) break;
    }
    return { items: out, subs: [...porSub.entries()].map(([s, l]) => [s, l.length]) };
  }
  function relHTML(titulo, sub, r) {
    if (!r.items.length) return "";
    return `<section class="rel" aria-label="${esc(titulo)}"><h3>${esc(titulo)}</h3><p class="rsub">${sub}</p>
      <div class="rtabs">${r.subs.map(([s, n]) => `<button class="chip" type="button" data-gosub="${esc(s)}">${esc(s)} (${n})</button>`).join("")}</div>
      <div class="strip">${r.items.map(i => card(i, { sub: true })).join("")}</div></section>`;
  }

  // ---------------- vista catalogo
  function filtrados() {
    const v = curVeh();
    let l = ITEMS.filter(i => listable(i, S.q) && fitsQ(i, S.q) && fitsFam(i, S.fam, S.sub) && fitsVeh(i, v));
    if (S.orden === "rel") l.sort((a, b) => (!!b.i.length - !!a.i.length) || (Math.min(b.a.length, 6) - Math.min(a.a.length, 6)) || a.d.localeCompare(b.d, "es"));
    else if (S.orden === "az") l.sort((a, b) => a.d.localeCompare(b.d, "es"));
    else if (S.orden === "cod") l.sort((a, b) => a.c.localeCompare(b.c));
    return l;
  }
  // ---------------- carrusel de banners (solo en la portada)
  const BAN = D.banners || {};
  function heroHTML() {
    return ["escritorio", "movil"].filter(t => (BAN[t] || []).length).map(t => {
      const l = BAN[t];
      return `<section class="hero ${t}" aria-roledescription="carrusel" aria-label="Destacados">
        <div class="htrack">${l.map((b, k) => `<button class="hslide" type="button" data-bk="${k}" data-bt="${t}" aria-label="${esc(b.alt)}"><img src="${esc(b.img)}" alt="${esc(b.alt)}"${k ? ' loading="lazy"' : ""}></button>`).join("")}</div>
        ${l.length > 1 ? `<button class="hnav prev" type="button" aria-label="Anterior">‹</button><button class="hnav next" type="button" aria-label="Siguiente">›</button>
        <div class="hdots">${l.map((b, k) => `<button type="button" data-hd="${k}" aria-label="Banner ${k + 1}" aria-current="${k === 0}"></button>`).join("")}</div>` : ""}</section>`;
    }).join("");
  }
  let heroTimer;
  function bindHero() {
    clearInterval(heroTimer);
    document.querySelectorAll(".hero").forEach(h => {
      const tr = h.querySelector(".htrack"), n = tr.children.length;
      const idx = () => Math.round(tr.scrollLeft / Math.max(1, tr.clientWidth));
      const ir = k => tr.scrollTo({ left: ((k + n) % n) * tr.clientWidth, behavior: "smooth" });
      tr.addEventListener("scroll", () => { const k = idx(); h.querySelectorAll("[data-hd]").forEach(d => d.setAttribute("aria-current", +d.dataset.hd === k)); }, { passive: true });
      h.querySelectorAll("[data-hd]").forEach(d => d.onclick = () => ir(+d.dataset.hd));
      h.querySelector(".prev") && (h.querySelector(".prev").onclick = () => ir(idx() - 1));
      h.querySelector(".next") && (h.querySelector(".next").onclick = () => ir(idx() + 1));
      h.onmouseenter = () => h._pausa = true; h.onmouseleave = () => h._pausa = false;
      tr.addEventListener("touchstart", () => { h._pausa = true; }, { passive: true });
    });
    heroTimer = setInterval(() => {
      const h = [...document.querySelectorAll(".hero")].find(x => x.offsetParent);
      if (!h || h._pausa || document.hidden) return;
      const tr = h.querySelector(".htrack"), n = tr.children.length, k = Math.round(tr.scrollLeft / Math.max(1, tr.clientWidth));
      if (n > 1) tr.scrollTo({ left: ((k + 1) % n) * tr.clientWidth, behavior: "smooth" });
    }, 5000);
    document.querySelectorAll(".hslide").forEach(b => b.onclick = () => {
      const x = BAN[b.dataset.bt][+b.dataset.bk];
      if (!x.marca) return;
      const hayModelo = x.modelo && ITEMS.some(i => (i.a || []).some(a => a[0] === x.marca && a[1] === x.modelo));
      limpiarCatalogo(); setVeh({ marca: x.marca, modelo: hayModelo ? x.modelo : "" });
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  }

  function renderCatalogo() {
    const l = filtrados();
    const v = curVeh();
    const veh = vehOn(v) ? [cap(v.marca), v.modelo, v.motor, v.anio].filter(Boolean).join(" ") : "";
    const titulo = S.sub || S.fam || (S.q ? `Resultados para “${S.q}”` : "Todos los repuestos");
    const chips = [];
    if (S.q) chips.push(`<button class="chip on" type="button" data-x="q">Búsqueda: ${esc(S.q)} <span class="x">×</span></button>`);
    if (veh) chips.push(`<button class="chip on" type="button" data-x="veh">${esc(veh)} <span class="x">×</span></button>`);
    if (S.fam) chips.push(`<button class="chip on" type="button" data-x="fam">${esc(S.sub ? S.fam + " › " + S.sub : S.fam)} <span class="x">×</span></button>`);
    const portada = !S.q && !S.fam && !vehOn(v);
    let h = (portada ? heroHTML() + promoHTML() : "") + `<div class="layout"><aside class="side" id="side" aria-label="Categorías">${treeHTML()}</aside><section aria-live="polite">
      <div class="tools"><div>
        <div class="crumbs"><button type="button" data-crumb="">Inicio</button>${S.fam ? ` › <button type="button" data-crumb="f">${esc(S.fam)}</button>` : ""}${S.sub ? ` › <b>${esc(S.sub)}</b>` : ""}</div>
        <div class="ttl">${esc(titulo)}</div>
        <div class="cnt"><b>${l.length}</b> producto${l.length === 1 ? "" : "s"}${veh ? ` para <b>${esc(veh)}</b>` : ""}</div>
      </div><div class="right">
        <button class="btn btn-fil" type="button" id="bFil">${ICON.fil} Categorías</button>
        <select id="orden" aria-label="Ordenar"><option value="rel">Más relevantes</option><option value="az">Nombre A–Z</option><option value="cod">Código</option></select>
        <div class="seg" role="group" aria-label="Vista"><button type="button" data-vista="grid" aria-pressed="${S.vista === "grid"}" title="Cuadrícula">${ICON.grid}</button><button type="button" data-vista="rows" aria-pressed="${S.vista === "rows"}" title="Filas">${ICON.rows}</button></div>

      <section class="sec2" aria-label="Referencias OEM"><h2>Referencias OEM <small>${oem.length ? oem.length + " número" + (oem.length === 1 ? "" : "s") + " de parte" : ""}</small></h2>${oemH}</section>
      ${relHTML("Podría interesarte", `Más de <b>${esc(i.f)}</b>${vehOn(v) ? ` para tu ${esc(veh)}` : " para los mismos vehículos"}`, r)}`;

  // ---------------- visor de fotos en grande
  function abrirVisor(i, k) {
    const d = $("#dFoto"), M = media(i), n = M.length;
    const ver = m => m.t === "vid" ? `<video src="${esc(m.s)}"${m.p ? ` poster="${esc(m.p)}"` : ""} controls autoplay muted loop playsinline></video>` : `<img src="${esc(m.s)}" alt="${esc(i.d)}">`;
    function pinta() {
      d.innerHTML = `<div class="vw">
        <div class="vh"><span class="tag">${esc(i.c)}</span><span class="vt">${esc(i.d)}</span><span class="vn">${k + 1} / ${n}</span>${M[k].t === "vid" ? `<button class="xbtn" type="button" data-fs aria-label="Pantalla completa">⛶<span class="fsl"> Pantalla completa</span></button>` : ""}<button class="xbtn" type="button" data-close>Cerrar ✕</button></div>
        <div class="vimg">${n > 1 ? `<button class="vnav prev" type="button" aria-label="Foto anterior">‹</button>` : ""}${ver(M[k])}${n > 1 ? `<button class="vnav next" type="button" aria-label="Foto siguiente">›</button>` : ""}</div>
        ${n > 1 ? `<div class="vthumbs">${M.map((m, j) => `<button type="button" data-vj="${j}"${m.t === "vid" ? ' class="tv"' : ""} aria-current="${j === k}">${m.t === "vid" && !m.p ? ICON.play : `<img src="${esc(m.t === "vid" ? m.p : m.s)}" alt="${m.t === "vid" ? "Video" : "Foto " + (j + 1)}">`}</button>`).join("")}</div>` : ""}</div>`;
      d.querySelector("[data-close]").onclick = () => d.close();
      d.querySelector("[data-fs]") && (d.querySelector("[data-fs]").onclick = () => pantallaCompleta(d.querySelector("video")));
      d.querySelector(".prev") && (d.querySelector(".prev").onclick = () => { k = (k - 1 + n) % n; pinta(); });
      d.querySelector(".next") && (d.querySelector(".next").onclick = () => { k = (k + 1) % n; pinta(); });
      d.querySelectorAll("[data-vj]").forEach(b => b.onclick = () => { k = +b.dataset.vj; pinta(); });
    }
    d.onkeydown = e => { if (n > 1 && e.key === "ArrowLeft") { k = (k - 1 + n) % n; pinta(); } if (n > 1 && e.key === "ArrowRight") { k = (k + 1) % n; pinta(); } };

    pinta();

  // ---------------- arma tu mantencion (maqueta: arma el kit con lo que hay cargado para el vehiculo)
  const KIT = [
    { k: "aceite", n: "Filtro de aceite", d: "Se cambia junto con el aceite", ico: "oil", f: i => i.s === "Filtro aceite", cant: 1 },
    { k: "aire", n: "Filtro de aire", d: "Aire que entra al motor", ico: "air", f: i => i.s === "Filtro aire", cant: 1 },
    { k: "polen", n: "Filtro de polen", d: "Cabina / aire acondicionado", ico: "cabin", f: i => i.s === "Filtro polen", cant: 1 },
    { k: "comb", n: "Filtro de combustible", d: "Bencina o diésel según tu motor", ico: "fuel", f: i => i.s === "Filtro combustible", cant: 1 },
    { k: "bujia", n: "Bujías", d: "Solo motores bencina · una por cilindro", ico: "plug", f: i => i.s === "Encendido" && /BUJIA/.test(norm(i.d)), cant: 4, bencina: true }
  ];
  const NO_KIT = /\b(PORTA|TAPA|SOPORTE|CAJA|CARCASA|BASE|ABRAZADERA|LLAVE|EMPAQUE|SELLO|ORING|O-RING)\b/;
  KIT.forEach(l => { const f = l.f; l.f = i => f(i) && !NO_KIT.test(norm(i.d)); });
  const esKit = i => KIT.some(l => l.f(i));
  const KS = { tier: "P", off: {}, pick: {}, cant: {}, veh: "" };
  const vehKey = v => [v.marca, v.modelo, v.motor, v.anio].join("|");
  function combustibles(v) {
    const s = new Set();
    for (const i of ITEMS) for (const a of (i.a || [])) if (a[4] && appMatch(a, v)) s.add(norm(a[4]));
    return s;
  }
  function elegirKit(ops, tier) {
    const rank = q => Math.abs(TORD.indexOf(TIER[q] ? q : "E") - TORD.indexOf(tier));
    return ops.slice().sort((a, b) => rank(a.q) - rank(b.q) || (b.pr > 0) - (a.pr > 0) || !!b.i.length - !!a.i.length || a.pr - b.pr)[0];
  }
  function lineasKit(v) {
    const fuels = combustibles(v), diesel = fuels.size > 0 && [...fuels].every(f => f.includes("DIESEL"));
    return KIT.map(l => {
      if (l.bencina && diesel) return { l, sin: "diesel", ops: [] };
      const ops = ITEMS.filter(i => l.f(i) && (i.a || []).length && fitsVeh(i, v));
      const pick = (KS.pick[l.k] && ops.find(x => x.c === KS.pick[l.k])) || elegirKit(ops, KS.tier);
      return { l, ops, pick, cant: KS.cant[l.k] || l.cant, on: !!pick && !KS.off[l.k] };
    });
  }
  function renderMantencion(keep) {
    const v = curVeh();
    if (KS.veh !== vehKey(v)) { KS.pick = {}; KS.cant = {}; KS.off = {}; KS.veh = vehKey(v); }
    const listo = !!(v.marca && v.modelo);
    const lbl = listo ? vehOptions(ITEMS.filter(esKit), v).motorLbl : (m => m);
    const vehTxt = [cap(v.marca), v.modelo, v.motor ? lbl(v.motor) : "", v.anio].filter(Boolean).join(" ");
    let h = `<div class="crumbs back"><button type="button" data-crumb="">‹ Inicio</button></div>
      <section class="mhead"><h1>Arma tu mantención</h1>
        <p>Te armamos el kit de filtros y bujías que calza con tu auto. Eliges la calidad, revisas cada pieza y lo agregas al carrito de una vez.</p>
        <div class="msteps"><span class="${listo ? "ok" : ""}"><i>1</i>Tu vehículo</span><span class="${listo ? "ok" : ""}"><i>2</i>Calidad del kit</span><span><i>3</i>Agregar al carrito</span></div>
        ${listo ? `<div class="mveh"><span class="car-chip">${esc(vehTxt)}</span>${!v.motor ? `<span style="font-size:13px;color:var(--band-muted)">Elige el motor arriba para afinar el kit</span>` : ""}<button class="link" type="button" id="mCambia">Cambiar vehículo</button></div>` : ""}
      </section>`;
    if (!listo) {
      const cnt = new Map();
      for (const i of ITEMS) if (esKit(i)) for (const k of new Set((i.a || []).filter(a => ORDEN_MARCA.includes(a[0])).map(a => a[0] + "|" + a[1]))) cnt.set(k, (cnt.get(k) || 0) + 1);
      const top = [...cnt.entries()].sort((a, b) => b[1] - a[1]).slice(0, 14);
      const m = preferido();
      h += `<div class="mpick-car"><h3>¿Para qué auto es?</h3>
        <div class="note">Elige marca y modelo en <b>Tu vehículo</b> (arriba) o parte por uno de los más buscados:</div>
        <div class="chips">${m ? `<button class="chip mine on" type="button" id="mMi">${ICON.ok} Mi auto: ${esc(autoTxt(m))}</button>` : ""}${top.map(([k]) => { const [ma, mo] = k.split("|"); return `<button class="chip" type="button" data-mv="${esc(k)}">${esc(cap(ma))} ${esc(mo)}</button>`; }).join("")}</div></div>`;
      $("#app").innerHTML = h;
      document.querySelectorAll("[data-mv]").forEach(b => b.onclick = () => { const [ma, mo] = b.dataset.mv.split("|"); setVeh({ marca: ma, modelo: mo }); });
      $("#mMi") && ($("#mMi").onclick = () => usarAuto(preferido()));
      $("[data-crumb]").onclick = inicio;
      return;
    }
    const L = lineasKit(v);
    const fuels = combustibles(v);
    const mixto = !v.motor && fuels.size > 1;
    const sel = L.filter(x => x.on);
    const tot = sel.reduce((a, x) => a + (x.pick.pr > 0 ? x.pick.pr * x.cant : 0), 0);
    const nCons = sel.filter(x => !(x.pick.pr > 0)).length;
    const opt = (x, l) => `<button class="opt2" type="button" data-pk="${l.k}" data-c="${esc(x.c)}" aria-pressed="${x === L.find(y => y.l === l).pick}">${thumbImg(x)}<span>${tierHTML(x.q)}<b>${x.pr > 0 ? clp(x.pr) : "Consultar"}</b><em>${esc([x.m, x.c].filter(Boolean).join(" · "))}</em></span></button>`;
    h += `<div class="mgrid"><div>
      <div class="mtier"><b>Calidad del kit</b><div class="tsel" role="group" aria-label="Calidad del kit">${TORD.map(q => `<button type="button" data-tier="${q}" aria-pressed="${KS.tier === q}">${tierHTML(q)}<small>${esc(TIER[q].d)}</small></button>`).join("")}</div>
        <span class="note">Elegimos la pieza de esa calidad para cada línea; si no hay, te proponemos la más cercana. Puedes cambiar cada una.</span></div>
      ${mixto ? `<div class="warnbar" style="margin-bottom:12px">Tu ${esc(cap(v.marca))} ${esc(v.modelo)} tiene versiones bencina y diésel: elige el motor en <b>Tu vehículo</b> para que el kit sea exacto.</div>` : ""}
      ${L.map(x => {
        const l = x.l;
        if (x.sin === "diesel") return `<div class="mline off"><div class="mlh"><input class="mchk" type="checkbox" disabled aria-label="${esc(l.n)}"><span class="mico">${ICON[l.ico]}</span><div class="mlt"><b>${esc(l.n)}</b><small>Tu motor es diésel: no usa bujías</small></div></div></div>`;
        if (!x.pick) return `<div class="mline off"><div class="mlh"><input class="mchk" type="checkbox" disabled aria-label="${esc(l.n)}"><span class="mico">${ICON[l.ico]}</span><div class="mlt"><b>${esc(l.n)}</b><small>${esc(l.d)}</small></div></div><div class="mnone">Aún no tenemos este repuesto cargado para tu vehículo. <button class="link" type="button" data-wsp>Consúltanos</button></div></div>`;
        const p = x.pick, distinta = p.q !== KS.tier && !KS.pick[l.k];
        const porQ = TORD.map(q => [q, x.ops.filter(o => (TIER[o.q] ? o.q : "E") === q).sort((a, b) => (b.pr > 0) - (a.pr > 0) || a.pr - b.pr)]).filter(([, a]) => a.length);
        return `<div class="mline${x.on ? "" : " off"}">
          <div class="mlh"><input class="mchk" type="checkbox" data-on="${l.k}"${x.on ? " checked" : ""} aria-label="Incluir ${esc(l.n)}"><span class="mico">${ICON[l.ico]}</span>
            <div class="mlt"><b>${esc(l.n)}</b><small>${esc(l.d)}</small></div>
            <div class="mlp">${p.pr > 0 ? `<span class="price">${clp(p.pr * x.cant)}</span>` : precio(p)}${x.cant > 1 && p.pr > 0 ? `<span class="note">${x.cant} × ${clp(p.pr)}</span>` : ""}</div></div>
          <div class="mpick"><a href="#/p/${encodeURIComponent(p.c)}" aria-label="Ver ${esc(p.d)}">${thumbImg(p)}</a>
            <div class="qinfo"><span class="tag">${esc(p.c)}</span><a href="#/p/${encodeURIComponent(p.c)}"><div class="qd">${esc(p.d)}</div></a><div class="qm">${tierHTML(p.q)} ${esc([p.m, cap(p.p)].filter(Boolean).join(" · "))}</div>${distinta ? `<span class="mwarn">No hay en ${TIER[KS.tier].n} para tu auto: te proponemos ${TIER[p.q] ? TIER[p.q].n : "Económica"}</span>` : ""}</div>
            <div class="qty"><button type="button" data-cn="${l.k}" data-d="-1" aria-label="Menos">−</button><input value="${x.cant}" readonly aria-label="Cantidad"><button type="button" data-cn="${l.k}" data-d="1" aria-label="Más">+</button></div></div>
          ${x.ops.length > 1 ? `<details class="mopts"><summary>${ICON.car} Ver ${x.ops.length} opciones para tu auto${porQ.length > 1 ? ` en ${porQ.length} calidades` : ""}</summary><div class="olist">${porQ.map(([, a]) => a.map(o => opt(o, l)).join("")).join("")}</div></details>` : ""}
        </div>`;
      }).join("")}
    </div>
    <aside class="step msum"><h3>Tu kit</h3>
      <div class="note">${esc(vehTxt)}</div>
      <div>${sel.length ? sel.map(x => `<div class="ml"><span>${esc(x.l.n)}${x.cant > 1 ? ` ×${x.cant}` : ""}</span><b>${x.pick.pr > 0 ? clp(x.pick.pr * x.cant) : "Consultar"}</b></div>`).join("") : `<div class="note">Marca al menos una línea.</div>`}</div>
      <div class="tot"><span>Total kit</span><b>${clp(tot)}</b></div>
      ${nCons ? `<div class="note">${nCons} producto${nCons === 1 ? "" : "s"} sin precio: te lo confirmamos antes de pagar.</div>` : ""}
      <button class="btn pri" type="button" id="mAdd"${sel.length ? "" : " disabled"}>${ICON.cart} Agregar kit al carrito (${sel.reduce((a, x) => a + x.cant, 0)})</button>
      <div class="note">Precios referenciales de la maqueta · mano de obra no incluida.</div>
      <div class="carbox"><h4>Recuérdame la próxima</h4><div class="mrem"><input id="mKm" inputmode="numeric" placeholder="Kilometraje actual"><button class="btn sec" type="button" id="mRem">Avísame</button></div><span class="note">Te avisamos por correo o WhatsApp cuando toque la siguiente mantención.</span></div>
    </aside></div>`;
    $("#app").innerHTML = h;
    if (!keep) window.scrollTo(0, 0);
    $("[data-crumb]").onclick = inicio;
    $("#mCambia") && ($("#mCambia").onclick = () => { setVeh({}); window.scrollTo({ top: 0, behavior: "smooth" }); });
    document.querySelectorAll("[data-tier]").forEach(b => b.onclick = () => { KS.tier = b.dataset.tier; KS.pick = {}; renderMantencion(true); });
    document.querySelectorAll("[data-on]").forEach(b => b.onchange = () => { KS.off[b.dataset.on] = !b.checked; renderMantencion(true); });
    document.querySelectorAll("[data-cn]").forEach(b => b.onclick = () => { const k = b.dataset.cn, x = L.find(y => y.l.k === k); KS.cant[k] = Math.max(1, x.cant + +b.dataset.d); renderMantencion(true); });
    document.querySelectorAll("[data-pk]").forEach(b => b.onclick = () => { KS.pick[b.dataset.pk] = b.dataset.c; KS.off[b.dataset.pk] = false; renderMantencion(true); });
    document.querySelectorAll("[data-wsp]").forEach(b => b.onclick = () => toast("WhatsApp: número por definir (próximamente)"));
    $("#mAdd").onclick = () => { const c = carro(); sel.forEach(x => c[x.pick.c] = (c[x.pick.c] || 0) + x.cant); setCarro(c); toast(`Kit agregado al carrito · ${sel.length} repuesto${sel.length === 1 ? "" : "s"}`); abrirCarro(); };
    $("#mRem").onclick = () => toast("Recordatorio de mantención: próximamente");
  }

  // ---------------- portada: entrada a la mantencion y productos en video
  function promoHTML() {
    return `<section class="promo" aria-label="Arma tu mantención"><span class="pi">${ICON.wrench}</span>
      <div class="pt"><b>Arma tu mantención</b><span>Filtros de aceite, aire, polen y combustible + bujías que calzan con tu auto, en la calidad que prefieras.</span></div>
      <a class="btn pri" href="#/mantencion">Armar mi kit</a></section>`;
  }
  function reelHTML(i, k, extra) {
    const v = curVeh();
    return `<a class="reel" href="#/p/${encodeURIComponent(i.c)}" data-reel="${esc(i.v)}" data-ri="${k}"><img src="${esc(i.vp || (i.i || [])[0] || "")}" alt="" loading="lazy"><span class="rp">${ICON.play}</span>
      ${extra && vehOn(v) && fitsVeh(i, v) ? `<span class="rfit">${ICON.ok} Compatible</span>` : ""}
      <span class="ro">${extra ? tierHTML(i.q) : ""}<b>${esc(extra ? i.d : i.s)}</b><small>${esc(i.c)}</small>${precio(i)}</span></a>`;
  }
  const VIDS = () => ITEMS.filter(i => i.v && !i.x);
  function reelsHTML() {
    const l = VIDS();
    if (!l.length) return "";
    return `<section class="reels" aria-label="Productos en video"><div class="rhead"><div><h3>Míralos en video</h3><p class="rsub">Mira el repuesto y su empaque antes de comprar.</p></div>
      <a class="vall" href="#/videos">Ver todo (${l.length}) ${ICON.car}</a></div>
      <div class="rwrap"><button class="rnav prev" type="button" aria-label="Anteriores" hidden>‹</button>
      <div class="rstrip">${l.map((i, k) => reelHTML(i, k)).join("")}<a class="reel rmore" href="#/videos"><span>${ICON.play}</span><b>Ver todo el catálogo en video</b><small>${l.length} repuestos</small></a></div>
      <button class="rnav next" type="button" aria-label="Siguientes">›</button></div></section>`;
  }
  function bindReels(lista) {
    document.querySelectorAll("[data-reel]").forEach(a => {
      a.onmouseenter = () => {
        if (a.querySelector("video")) return;
        const vd = document.createElement("video");
        vd.src = a.dataset.reel; vd.muted = true; vd.loop = true; vd.playsInline = true; vd.autoplay = true;
        a.insertBefore(vd, a.querySelector(".rp")); vd.play().catch(() => {});
      };
      a.onmouseleave = () => { const vd = a.querySelector("video"); if (vd) vd.remove(); };
      a.onclick = e => { e.preventDefault(); abrirReel(lista || VIDS(), +a.dataset.ri); };
    });
    document.querySelectorAll(".rwrap").forEach(w => {
      const s = w.querySelector(".rstrip"), pv = w.querySelector(".prev"), nx = w.querySelector(".next");
      const upd = () => { pv.hidden = s.scrollLeft < 8; nx.hidden = s.scrollLeft + s.clientWidth > s.scrollWidth - 8; };
      pv.onclick = () => s.scrollBy({ left: -s.clientWidth * .8, behavior: "smooth" });
      nx.onclick = () => s.scrollBy({ left: s.clientWidth * .8, behavior: "smooth" });
      s.addEventListener("scroll", upd, { passive: true }); upd();
    });
  }

  // ---------------- catalogo en video (#/videos)
  const VS = { fam: "" };
  function renderVideos() {
    const v = curVeh(), veh = vehOn(v);
    const todos = VIDS();
    const fams = new Map();
    todos.forEach(i => fams.set(i.f, (fams.get(i.f) || 0) + 1));
    let l = todos.filter(i => !VS.fam || i.f === VS.fam);
    if (veh) l = l.slice().sort((a, b) => fitsVeh(b, v) - fitsVeh(a, v));
    const vehTxt = [cap(v.marca), v.modelo, v.motor, v.anio].filter(Boolean).join(" ");
    $("#app").innerHTML = `<div class="crumbs back"><button type="button" data-crumb="">‹ Inicio</button></div>
      <section class="mhead vhead"><h1>Catálogo en video</h1>
        <p>${todos.length} repuestos en video. Pasa el mouse para verlos en movimiento y haz clic para verlos en grande con su precio.${veh ? ` Primero los compatibles con tu ${esc(vehTxt)}.` : ""}</p></section>
      <div class="vchips"><button class="chip${!VS.fam ? " on" : ""}" type="button" data-vf="">Todos (${todos.length})</button>${[...fams.entries()].sort((a, b) => a[0].localeCompare(b[0], "es")).map(([f, n]) => `<button class="chip${VS.fam === f ? " on" : ""}" type="button" data-vf="${esc(f)}">${esc(f)} (${n})</button>`).join("")}</div>
      <div class="vgrid">${l.map((i, k) => reelHTML(i, k, true)).join("")}</div>`;
    window.scrollTo(0, 0);
    $("[data-crumb]").onclick = inicio;
    document.querySelectorAll("[data-vf]").forEach(b => b.onclick = () => { VS.fam = b.dataset.vf; renderVideos(); });
    bindReels(l);
  }
  // reproductor grande: video + datos del producto, con anterior / siguiente
  function abrirReel(lista, k) {
    const d = $("#dFoto"), n = lista.length;
    function pinta() {
      const i = lista[k], v = curVeh();
      d.innerHTML = `<div class="vw"><div class="vh"><span class="vt">Catálogo en video</span><span class="vn">${k + 1} / ${n}</span><button class="xbtn" type="button" data-fs aria-label="Pantalla completa">⛶<span class="fsl"> Pantalla completa</span></button><button class="xbtn" type="button" data-close>Cerrar ✕</button></div>
        <div class="rpbody">${n > 1 ? `<button class="vnav prev" type="button" aria-label="Video anterior">‹</button>` : ""}
          <div class="rpvid"><video src="${esc(i.v)}"${i.vp ? ` poster="${esc(i.vp)}"` : ""} controls autoplay muted loop playsinline></video></div>
          <div class="rpinfo"><span class="tag">${esc(i.c)}</span><h3>${esc(i.d)}</h3>
            <div class="qm">${tierHTML(i.q)} ${esc([i.m, cap(i.p)].filter(Boolean).join(" · "))}</div>
            ${vehOn(v) ? (fitsVeh(i, v) ? `<span class="fit ok">${ICON.ok} Compatible con tu vehículo</span>` : `<span class="fit no">No confirmado para tu vehículo</span>`) : ""}
            <div class="note">${esc(i.f)} › ${esc(i.s)}</div>
            ${precio(i, true)}
            <div class="rpact"><button class="add" type="button" data-radd="${esc(i.c)}">${ICON.cart}<span class="lbl">Agregar al carrito</span></button><a class="btn" href="#/p/${encodeURIComponent(i.c)}" data-rfi>Ver ficha</a></div></div>
          ${n > 1 ? `<button class="vnav next" type="button" aria-label="Video siguiente">›</button>` : ""}</div></div>`;
      d.querySelector("[data-close]").onclick = () => d.close();
      d.querySelector("[data-fs]").onclick = () => pantallaCompleta(d.querySelector("video"));
      d.querySelector("[data-rfi]").onclick = () => d.close();
      d.querySelector("[data-radd]").onclick = e => addCarro(i.c, 1, e.currentTarget);
      d.querySelector(".prev") && (d.querySelector(".prev").onclick = () => { k = (k - 1 + n) % n; pinta(); });
      d.querySelector(".next") && (d.querySelector(".next").onclick = () => { k = (k + 1) % n; pinta(); });
    }
    d.onkeydown = e => { if (n > 1 && e.key === "ArrowLeft") { k = (k - 1 + n) % n; pinta(); } if (n > 1 && e.key === "ArrowRight") { k = (k + 1) % n; pinta(); } };
    d.onclick = e => { if (e.target === d || e.target.classList.contains("rpbody")) d.close(); };
    pinta();
    if (!d.open) d.showModal();
  }
  function pantallaCompleta(el) {
    if (!el) return;
    const f = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitEnterFullscreen;
    if (f) try { const r = f.call(el); r && r.catch && r.catch(() => {}); } catch (e) { /* sin pantalla completa */ }
  }

  // ---------------- carrito
  const carro = () => store.get("om_carro", {});
  function setCarro(c) { store.set("om_carro", c); pintaBadge(); }
  function pintaBadge() {
    const n = Object.values(carro()).reduce((a, b) => a + b, 0);
    $("#nCarro").textContent = n; $("#nCarro").hidden = !n;
  }
  function addCarro(cod, n, btn) {
    const c = carro(); c[cod] = (c[cod] || 0) + n; setCarro(c);
    toast(`Agregado al carrito · ${cod}`);
    if (btn) { btn.classList.add("done"); btn.innerHTML = ICON.ok + '<span class="lbl">Listo</span>'; setTimeout(() => { btn.classList.remove("done"); btn.innerHTML = ICON.cart + '<span class="lbl">Agregar</span>'; }, 1200); }
  }
  const lineas = () => Object.entries(carro()).filter(([c]) => BY.has(c)).map(([c, n]) => [BY.get(c), n]);
  const total = () => lineas().reduce((a, [i, n]) => a + i.pr * n, 0);

      <div><div class="t">${esc(i.d)}</div><div class="s mono">${esc(i.c)}</div><div class="s">${i.pr > 0 ? clp(i.pr) + " c/u" : "Precio a consultar"}</div></div>

      <b>${i.pr > 0 ? clp(i.pr * n) : "Consultar"}</b>${edit ? `<button class="link" type="button" data-rm="${esc(i.c)}">Quitar</button>` : ""}</div></div>`;

  function abrirCarro() {
    const d = $("#dCarro"), l = lineas();

      <div class="db">${l.length ? l.map(([i, n]) => lineaHTML(i, n, true)).join("") + (l.some(([i]) => !(i.pr > 0)) ? `<div class="note" style="margin-top:10px">Los productos sin precio se confirman por WhatsApp o en tienda.</div>` : "") : `<div class="empty" style="margin-top:16px"><b>Tu carrito está vacío</b>Agrega repuestos desde el catálogo.</div>`}</div>
      <div class="df"><div class="tot"><span>Subtotal</span><b>${clp(total())}</b></div><div class="note">Despacho e impuestos se calculan en el pago.</div>

    d.querySelectorAll("[data-cq]").forEach(b => b.onclick = () => { const c = carro(); c[b.dataset.cq] = Math.max(1, (c[b.dataset.cq] || 1) + +b.dataset.d); setCarro(c); abrirCarro(); });

        </div>
        <div class="step"><h3><i>2</i>Entrega</h3>
          <label class="opt"><input type="radio" name="ent" checked><span><b>Retiro en tienda</b><small>Dirección y horario por definir</small></span></label>
          <label class="opt"><input type="radio" name="ent"><span><b>Despacho a domicilio</b><small>Comunas, costos y plazos por definir</small></span></label>
        </div>
        <div class="step off"><h3><i>3</i>Pago</h3>
          <div class="paym"><div>Medio de pago 1<br>por definir</div><div>Medio de pago 2<br>por definir</div><div>Transferencia<br>por definir</div></div>
          <button class="btn pri" type="button" disabled>Pagar ${clp(total())}</button>
          <span class="note">El botón se activa cuando se defina el medio de pago.</span>
        </div>
      </div>
      <aside class="step sum"><h3>Resumen</h3>${l.map(([i, n]) => lineaHTML(i, n, false)).join("")}
        <div class="tot"><span>Subtotal</span><b>${clp(total())}</b></div><div class="tot"><span>Despacho</span><span class="note">por definir</span></div></aside></div>`;
    $("#bLog") && ($("#bLog").onclick = abrirCuenta);
    window.scrollTo(0, 0);
  }

  // ---------------- cuenta y mi auto (maqueta: queda solo en este navegador)
  const cuenta = () => store.get("om_cuenta", null);
  const preferido = () => { const u = cuenta(); return u && u.sesion && u.autos && (u.autos.find(a => a.pref) || u.autos[0]) || null; };
  const autoTxt = a => [cap(a.marca), a.modelo, a.motor, a.anio].filter(Boolean).join(" ");
  function usarAuto(a) { setVeh(a); S.miAuto = true; renderVeh(); }
  function selectorAuto(id) {
    // cascada propia del formulario: usa todo el catalogo
    const st = { marca: "", modelo: "", motor: "", anio: "" };
    const w = document.getElementById(id);
    function pinta() {
      const c = vehOptions(ITEMS, st);
      w.innerHTML = `<div class="two"><label class="fld"><span>Marca</span><select data-k="marca"></select></label><label class="fld"><span>Modelo</span><select data-k="modelo"></select></label></div>
        <div class="two"><label class="fld"><span>Motor</span><select data-k="motor"></select></label><label class="fld"><span>Año</span><select data-k="anio"></select></label></div>`;
      fillSelect(w.querySelector('[data-k="marca"]'), "Marca", c.marca, st.marca, ordenMarca, cap);
      fillSelect(w.querySelector('[data-k="modelo"]'), "Modelo", c.modelo, st.modelo, (a, b) => a.localeCompare(b, "es", { numeric: true }));
      fillSelect(w.querySelector('[data-k="motor"]'), "Motor (opcional)", c.motor, st.motor, c.motorOrd, c.motorLbl);
      fillSelect(w.querySelector('[data-k="anio"]'), "Año (opcional)", c.anio, st.anio, (a, b) => b - a);
      w.querySelectorAll("select").forEach(s => s.onchange = () => {
        const k = s.dataset.k; st[k] = s.value;
        if (k === "marca") st.modelo = st.motor = st.anio = ""; if (k === "modelo") st.motor = st.anio = "";
        pinta();
      });
    }
    pinta();
    return st;
  }
  function abrirCuenta() {
    const d = $("#dCuenta"), u = cuenta();
    if (u && u.sesion) {
      d.innerHTML = `<div class="mw"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Hola, ${esc(u.nombre.split(" ")[0])}</h2><button class="xbtn" type="button" data-close>Cerrar</button></div>
        <div class="note">${esc(u.email)}</div>
        <div class="carbox"><h4>Mis autos</h4>
          ${(u.autos || []).length ? u.autos.map((a, k) => `<div class="myc"><button class="star${a.pref ? " on" : ""}" type="button" data-pref="${k}" title="Auto preferido" aria-label="Marcar como preferido">★</button><div class="nm">${esc(autoTxt(a))}<small>${a.pref ? "Auto preferido · se aplica al entrar" : "Toca la estrella para hacerlo preferido"}</small></div><button class="link" type="button" data-usar="${k}">Ver repuestos</button><button class="link" type="button" data-qa="${k}">Quitar</button></div>`).join("") : `<div class="note">Aún no agregas autos.</div>`}
          <div id="selA"></div><button class="btn sec" type="button" id="bAddA">Agregar auto</button><span class="err" id="eA"></span>
        </div>
        <div class="warnbar">Maqueta: la cuenta y tus autos se guardan solo en este navegador.</div>
        <button class="btn" type="button" id="bSalir">Cerrar sesión</button></div>`;
      const st = selectorAuto("selA");
      $("#bAddA", d).onclick = () => {
        if (!st.marca || !st.modelo) { $("#eA", d).textContent = "Elige al menos marca y modelo."; return; }
        const x = cuenta(); x.autos = x.autos || []; x.autos.push({ marca: st.marca, modelo: st.modelo, motor: st.motor, anio: st.anio, pref: !x.autos.length });
        store.set("om_cuenta", x); abrirCuenta(); renderVeh();
      };
      d.querySelectorAll("[data-pref]").forEach(b => b.onclick = () => { const x = cuenta(); x.autos.forEach((a, k) => a.pref = k === +b.dataset.pref); store.set("om_cuenta", x); abrirCuenta(); renderVeh(); });
      d.querySelectorAll("[data-qa]").forEach(b => b.onclick = () => { const x = cuenta(); x.autos.splice(+b.dataset.qa, 1); if (x.autos.length && !x.autos.some(a => a.pref)) x.autos[0].pref = true; store.set("om_cuenta", x); abrirCuenta(); renderVeh(); });
      d.querySelectorAll("[data-usar]").forEach(b => b.onclick = () => { const a = cuenta().autos[+b.dataset.usar]; d.close(); usarAuto(a); go("#/"); });
      $("#bSalir", d).onclick = () => { const x = cuenta(); x.sesion = false; store.set("om_cuenta", x); d.close(); if (S.miAuto) setVeh({}); pintaCuenta(); renderVeh(); };
    } else {
      const crear = !u;
      d.innerHTML = `<div class="mw"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Mi cuenta</h2><button class="xbtn" type="button" data-close>Cerrar</button></div>
        <div class="tabs" role="tablist"><button type="button" role="tab" data-tab="in" aria-selected="${!crear}">Ingresar</button><button type="button" role="tab" data-tab="up" aria-selected="${crear}">Crear cuenta</button></div>
        <form id="fIn"${crear ? " hidden" : ""} class="mw" style="padding:0">
          <label class="fld"><span>Correo</span><input name="email" type="email" required autocomplete="email"></label>
          <label class="fld"><span>Contraseña</span><input name="pw" type="password" required autocomplete="current-password"></label>
          <span class="err" id="eIn"></span><button class="btn pri" type="submit">Ingresar</button></form>
        <form id="fUp"${crear ? "" : " hidden"} class="mw" style="padding:0">
          <label class="fld"><span>Nombre</span><input name="nombre" required autocomplete="name"></label>
          <div class="two"><label class="fld"><span>Correo</span><input name="email" type="email" required autocomplete="email"></label><label class="fld"><span>Contraseña</span><input name="pw" type="password" required minlength="4" autocomplete="new-password"></label></div>
          <div class="carbox"><h4>Mi auto <span class="note" style="text-transform:none;letter-spacing:0">(opcional)</span></h4><div id="selU"></div><span class="note">Lo usamos para mostrarte primero lo que le sirve.</span></div>
          <span class="err" id="eUp"></span><button class="btn pri" type="submit">Crear cuenta</button></form>
        <div class="warnbar">Maqueta: los datos se guardan solo en este navegador, no se envían a ningún servidor.</div></div>`;
      const st = selectorAuto("selU");
      d.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => {
        d.querySelectorAll("[data-tab]").forEach(x => x.setAttribute("aria-selected", x === b));
        $("#fIn", d).hidden = b.dataset.tab !== "in"; $("#fUp", d).hidden = b.dataset.tab !== "up";
      });
      $("#fIn", d).onsubmit = e => {
        e.preventDefault(); const f = new FormData(e.target), x = cuenta();
        if (!x || x.email.toLowerCase() !== String(f.get("email")).toLowerCase() || x.pw !== f.get("pw")) { $("#eIn", d).textContent = "Correo o contraseña no coinciden (en esta maqueta, crea primero la cuenta)."; return; }
        x.sesion = true; store.set("om_cuenta", x); d.close(); entrar();
      };
      $("#fUp", d).onsubmit = e => {
        e.preventDefault(); const f = new FormData(e.target);
        const autos = st.marca && st.modelo ? [{ marca: st.marca, modelo: st.modelo, motor: st.motor, anio: st.anio, pref: true }] : [];
        store.set("om_cuenta", { nombre: String(f.get("nombre")).trim(), email: String(f.get("email")).trim(), pw: f.get("pw"), autos, sesion: true });
        d.close(); entrar(); toast("Cuenta creada");
      };
    }
    d.querySelectorAll("[data-close]").forEach(b => b.onclick = () => d.close());
    if (!d.open) d.showModal();
  }
  function entrar() { pintaCuenta(); const m = preferido(); if (m) usarAuto(m); else renderVeh(); }
  function pintaCuenta() { const u = cuenta(); $("#lCuenta").textContent = u && u.sesion ? u.nombre.split(" ")[0] : "Ingresar"; }
  $("#bCuenta").onclick = abrirCuenta;
  $(".logo").onclick = e => { e.preventDefault(); inicio(); };

  // ---------------- busqueda, ruteo, util
  let tq;
  $("#q").addEventListener("input", e => { clearTimeout(tq); tq = setTimeout(() => { S.q = e.target.value.trim(); S.lim = PAGE; if (location.hash.startsWith("#/p/") || location.hash === "#/pago" || location.hash === "#/mantencion" || location.hash === "#/videos") go("#/"); else refresh(); }, 180); });
  function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 1700); }
  function go(h) { if (location.hash === h) refresh(); else location.hash = h; }
  function refresh() {
    renderVeh();
    const h = decodeURIComponent(location.hash.slice(1) || "/");
    clearInterval(heroTimer);
    if (h.startsWith("/p/")) { const r = h.slice(3).split("/"); renderProducto(r[0], r[1] === "video"); }
    else if (h === "/pago") renderPago();
    else if (h === "/mantencion") renderMantencion();
    else if (h === "/videos") renderVideos();
    else renderCatalogo();
  }
  window.addEventListener("hashchange", refresh);
  document.addEventListener("click", e => { const d = e.target.closest("dialog"); if (d && e.target === d) d.close(); });
  if (D.logo) { const li = $("#logoImg"); li.src = D.logo; li.hidden = false; $(".logo").classList.add("con-img"); }
  $("#bWsp").onclick = () => toast("WhatsApp: número por definir (próximamente)");
  const nVis = ITEMS.filter(i => !i.x).length;
  $("#gen").textContent = (D.muestra ? `Maqueta con ${nVis} productos de muestra · ` : `${nVis} productos · `) + "datos al " + (D.generado || "");
  pintaBadge(); pintaCuenta();
  const m = preferido();
  if (m) { S.marca = m.marca; S.modelo = m.modelo; S.motor = m.motor || ""; S.anio = m.anio ? String(m.anio) : ""; S.miAuto = true; }
  refresh();
})();
</script>
</body>

</html>
